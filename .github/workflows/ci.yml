name: relay-node-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install validation tools
        run: |
          python3 -m pip install --disable-pip-version-check pytest==8.3.5
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Verify public allowlist and secret policy
        run: |
          python3 scripts/check_public_tree.py .
          python3 scripts/secret_scan.py .

      - name: Check shell and Python
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          shellcheck install.sh scripts/*.sh
          python3 -m compileall -q relay_agent scripts tests

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m pytest -q -p no:cacheprovider
